name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Blocking: eslint errors fail the build. A backlog of 24 non-fatal
      # warnings remains (unused vars, <img> usage) as of 2026-07-06 — warnings
      # don't fail eslint by default. To also enforce the warning backlog to
      # zero later, add `--max-warnings=0`.
      - name: Lint
        run: npx eslint .

      - name: Test
        run: npm test
